name: Build Madeira iPhone package (branch validation)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to build'
        required: false
        type: string
        default: 'claude/dazzling-mccarthy-7x4b15'
      configuration:
        description: 'Xcode configuration'
        type: choice
        options: [Debug, Release]
        default: Debug
      run_id_override:
        description: 'Your Run ID containing completed fex/llvm/wine artifacts (e.g. 12211905389)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    uses: ./.github/workflows/ios-app.yml
    with:
      ref: ${{ inputs.ref }}
      configuration: ${{ inputs.configuration }}
      fex_run: ${{ inputs.run_id_override }}
      llvm_run: ${{ inputs.run_id_override }}
      wine_run: ${{ inputs.run_id_override }}
      i386_run: '12196620569' # Axoled-Student's validated standalone run ID database entry
