name: Build Madeira 0.1.3 IPA (late-readback patch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'willfaust/Madeira tag, branch or commit to build'
        required: false
        type: string
        default: 'v0.1.3'
      apply_patch:
        description: 'Apply d3d9_late_readback.patch to DXMT'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout Madeira source
        uses: actions/checkout@v4
        with:
          repository: willfaust/Madeira
          ref: ${{ inputs.ref || 'v0.1.3' }}
          submodules: recursive

      - name: Fetch your patch from this fork
        uses: actions/checkout@v4
        with:
          path: fork-files
          sparse-checkout:
