name: Build Madeira iPhone package (branch validation)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to build (e.g. Axoled-Student/Madeira:claude/dazzling-mccarthy-7x4b15)'
        required: false
        type: string
      configuration:
        description: 'Xcode configuration'
        type: choice
        options: [Debug, Release]
        default: Debug

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/ios-app.yml
    with:
      ref: ${{ inputs.ref }}
      configuration: ${{ inputs.configuration }}
