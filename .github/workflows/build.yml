name: Build Madeira iPhone package (branch validation)
# Temporary: workflow_dispatch only works for workflows on the default branch, so
# this runs the full build for pushes to the development branch. Delete once
# the workflows are on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
  permissions:
  contents: read
  actions: read
jobs:
  build:
    uses: ./.github/workflows/ios-app.yml
