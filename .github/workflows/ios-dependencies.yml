name: Build iOS Dependency

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      ref:
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Fetch Target Codebase
        uses: actions/checkout@v4
        with:
          repository: 'Axoled-Student/Madeira'
          ref: 'claude/dazzling-mccarthy-7x4b15'
          submodules: recursive

      - name: Fetch Local Script Tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
          path: local-tools

      - name: Inject Local Scripts
        run: |
          if [ -d "local-tools/scripts" ]; then
            mkdir -p scripts
            cp -R local-tools/scripts/* ./scripts/
            rm -rf local-tools
            chmod +x scripts/*.sh
          fi

      - name: Upgrade Build Tools
        run: |
          echo "Installing modern build dependencies..."
          brew install bison llvm mingw-w64
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          
          # Force export cross-compiler targets explicitly into the environment
          echo "CC=/opt/homebrew/bin/i686-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "CXX=/opt/homebrew/bin/i686-w64-mingw32-g++" >> $GITHUB_ENV

      - name: Build dependency component
        run: |
          mkdir -p ci-output
          set -o pipefail
          
          # This routes individual components to the correct shell files
          if [ "${{ inputs.component }}" = "llvm" ]; then
            bash scripts/ci-build-llvm.sh 2>&1 | tee ci-output/llvm-build.log
          else
            bash scripts/ci-build-dependency.sh ${{ inputs.component }} 2>&1 | tee ci-output/${{ inputs.component }}-build.log
          fi

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.component }}
          path: |
            ci-output/
            build/${{ inputs.component }}-ios/obj/*.err
          if-no-files-found: error
          retention-days: 1
