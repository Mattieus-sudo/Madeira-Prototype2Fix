name: Build iOS Dependency

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      ref:
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'Axoled-Student/Madeira'
          ref: ${{ inputs.ref }}
      - name: Build dependency component
        run: |
          mkdir -p ci-output
          set -o pipefail
          bash scripts/ci-build-${{ inputs.component }}.sh 2>&1 | tee ci-output/${{ inputs.component }}-build.log
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.component }}
          path: |
            ci-output/
            build/${{ inputs.component }}-ios/obj/*.err
          if-no-files-found: error
          retention-days: 1
