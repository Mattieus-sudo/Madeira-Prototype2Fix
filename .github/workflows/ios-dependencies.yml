    steps:
      - name: Fetch Target Codebase
        uses: actions/checkout@v4
        with:
          repository: 'Axoled-Student/Madeira'
          ref: 'claude/dazzling-mccarthy-7x4b15'
          submodules: recursive

      - name: Fetch Local Script Tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
          path: local-tools

      - name: Inject Local Scripts
        run: |
          if [ -d "local-tools/scripts" ]; then
            mkdir -p scripts
            cp -R local-tools/scripts/* ./scripts/
            rm -rf local-tools
            chmod +x scripts/*.sh
          fi

      - name: Build dependency component
        run: |
          mkdir -p ci-output
          set -o pipefail
          bash scripts/ci-build-${{ inputs.component }}.sh 2>&1 | tee ci-output/${{ inputs.component }}-build.log

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.component }}
          path: |
            ci-output/
            build/${{ inputs.component }}-ios/obj/*.err
          if-no-files-found: error
          retention-days: 1
