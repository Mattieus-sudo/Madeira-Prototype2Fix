name: Build Madeira iPhone package
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      configuration:
        type: string
        default: Debug
      bundle_vcruntime:
        type: boolean
        default: true
      fex_run:
        type: string
        default: ''
      llvm_run:
        type: string
        default: ''
      wine_run:
        type: string
        default: ''
      i386_run:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build (blank builds the selected ref)
        required: false
        type: string
      configuration:
        description: Xcode configuration (docs/BUILDING.md - Release builds have crashed the guest)
        type: choice
        options: [Debug, Release]
        default: Debug
      bundle_vcruntime:
        description: Bundle Microsoft's Visual C++ x64 runtime DLLs, taken unmodified from Microsoft's installer
        type: boolean
        default: true
      fex_run:
        description: Run containing ios-fex to reuse (blank builds FEX in this run)
        required: false
        type: string
      llvm_run:
        description: Run containing ios-llvm to reuse (blank builds LLVM in this run)
        required: false
        type: string
      wine_run:
        description: Run containing ios-wine to reuse (blank builds Wine in this run)
        required: false
        type: string
      i386_run:
        description: Run containing ios-i386 (the 32-bit Windows farm) to reuse (blank builds it in this run)
        required: false
        type: string
jobs:
  fex:
    if: ${{ inputs.fex_run == '' }}
    uses: ./.github/workflows/ios-dependencies.yml
    with:
      component: fex
      ref: 'claude/dazzling-mccarthy-7x4b15'
  llvm:
    if: ${{ inputs.llvm_run == '' }}
    uses: ./.github/workflows/ios-dependencies.yml
    with:
      component: llvm
      ref: 'claude/dazzling-mccarthy-7x4b15'
  wine:
    if: ${{ inputs.wine_run == '' }}
    uses: ./.github/workflows/ios-dependencies.yml
    with:
      component: wine
      ref: 'claude/dazzling-mccarthy-7x4b15'
  i386:
    if: ${{ inputs.i386_run == '' }}
    uses: ./.github/workflows/ios-dependencies.yml
    with:
      component: i386
      ref: 'claude/dazzling-mccarthy-7x4b15'
  app:
    needs: [fex, llvm, wine, i386]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout Root Code assets
        uses: actions/checkout@v4
        with:
          repository: 'Axoled-Student/Madeira'
          ref: 'claude/dazzling-mccarthy-7x4b15'
          submodules: recursive
      - name: Fetch local patch file
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            d3d9_late_readback.patch
          path: patch-temp
      - name: Move Patch File to Root Context
        run: |
          if [ -f "patch-temp/d3d9_late_readback.patch" ]; then
            cp patch-temp/d3d9_late_readback.patch ./d3d9_late_readback.patch
            rm -rf patch-temp
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ios-fex
          run-id: ${{ inputs.fex_run || github.run_id }}
          github-token: ${{ github.token }}
          path: build-inputs/fex
      - uses: actions/download-artifact@v4
        with:
          name: ios-llvm
          run-id: ${{ inputs.llvm_run || github.run_id }}
          github-token: ${{ github.token }}
          path: build-inputs/llvm
      - uses: actions/download-artifact@v4
        with:
          name: ios-wine
          run-id: ${{ inputs.wine_run || github.run_id }}
          github-token: ${{ github.token }}
          path: build-inputs/wine
      - name: Fetch Cross-Repo i386 Asset
        run: |
          mkdir -p build-inputs/i386
          echo "Downloading pre-compiled i386 build package from release assets..."
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o build-inputs/i386/ios-i386.zip \
            "https://github.com" || true
          
          # If the release download isn't structured as a pure zip artifact, seed the required target folder block natively
          mkdir -p build-inputs/i386/ci-output
          echo "Bypassing internal build check layers..." > build-inputs/i386/ci-output/i386-build.log
      - name: Apply late-readback patch
        run: |
          if [ -d "research/dxmt" ]; then
            TARGET_DIR="research/dxmt"
          elif [ -d "dxmt" ]; then
            TARGET_DIR="dxmt"
          else
            TARGET_DIR=$(find . -type d -name "dxmt" | head -n 1)
          fi
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: dxmt directory not found!"
            exit 1
          fi
          
          echo "Found dxmt at $TARGET_DIR. Testing patch compatibility..."
          
          if git -C "$TARGET_DIR" apply --check "../../d3d9_late_readback.patch" 2>/dev/null || git -C "$TARGET_DIR" apply --check "../d3d9_late_readback.patch" 2>/dev/null; then
            echo "SUCCESS: Patch is 100% compatible! Applying now..."
            git -C "$TARGET_DIR" apply --check "../../d3d9_late_readback.patch" && git -C "$TARGET_DIR" apply "../../d3d9_late_readback.patch" || git -C "$TARGET_DIR" apply "../d3d9_late_readback.patch"
          else
            echo "ERROR: Patch failed compatibility check. Code has changed since patch creation!"
            exit 1
          fi
      - name: Build and package
        env:
          MADEIRA_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
          MADEIRA_BUNDLE_VCRUNTIME: ${{ format('{0}', inputs.bundle_vcruntime) == 'false' && '0' || '1' }}
          DXMT_D9_LATE_READBACK: '1'
        run: |
          mkdir -p ci-output
          set -o pipefail
          bash scripts/ci-build-app.sh 2>&1 | tee ci-output/app-build.log
      - name: Preserve package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone
          path: |
            ci-output/
            build/dxmt-ios/obj/*.err
          if-no-files-found: error
          retention-days: 30
