name: Build Madeira iPhone package
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: 'v0.1.3'
      configuration:
        type: string
        default: Debug
      bundle_vcruntime:
        type: boolean
        default: true
      fex_run:
        type: string
        default: ''
      llvm_run:
        type: string
        default: ''
      wine_run:
        type: string
        default: ''
      i386_run:
        type: string
        default: ''
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout Official Madeira Base Code
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: 'v0.1.3'
          submodules: false

      - name: Fetch Local Script Tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            d3d9_late_readback.patch
          path: local-context

      - name: Inject Local Automation Tools & Patch
        run: |
          if [ -d "local-context/scripts" ]; then
            mkdir -p scripts
            cp -R local-context/scripts/* ./scripts/
            chmod +x scripts/*.sh
          fi
          if [ -f "local-context/d3d9_late_readback.patch" ]; then
            cp local-context/d3d9_late_readback.patch ./d3d9_late_readback.patch
          fi
          rm -rf local-context

      - name: Packaging Native i386 Archive Layout From Release IPA
        run: |
          mkdir -p build-inputs/i386/staging_dlls/app/Madeira/i386-windows
          echo "Downloading production binary archive payload..."
          
          curl -L -o release-package.zip "https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa"
          unzip -q release-package.zip -d staging_extracted
          
          TARGET_SOURCE=$(find staging_extracted -type d -name "i386-windows" | head -n 1)
          if [ -n "$TARGET_SOURCE" ]; then
            echo "Found binaries at: $TARGET_SOURCE"
            cp -R "$TARGET_SOURCE"/* build-inputs/i386/staging_dlls/app/Madeira/i386-windows/
          else
            echo "CRITICAL ERROR: Could not find 'i386-windows' folder in IPA!"
            exit 1
          fi
          
          rm -rf staging_extracted release-package.zip
          tar -czf build-inputs/i386/i386-ios.tar.gz -C build-inputs/i386/staging_dlls .
          rm -rf build-inputs/i386/staging_dlls
          shasum -a 256 build-inputs/i386/i386-ios.tar.gz > build-inputs/i386/i386-sha256.txt

      - name: Build and package
        env:
          MADEIRA_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
          MADEIRA_BUNDLE_VCRUNTIME: ${{ format('{0}', inputs.bundle_vcruntime) == 'false' && '0' || '1' }}
        run: |
          mkdir -p ci-output
          set -o pipefail
          
          # 1. Initialize submodules natively to ensure the local Git index maps perfectly
          git submodule init
          
          # 2. Force the background script to download the submodules to its exact expected directories
          echo "Pre-fetching submodules natively..."
          git submodule update --init --depth 1 FEX dxmt madeira-dock
          
          # 3. Replicate the deep tracking architecture required by the compilation script layout context
          mkdir -p research
          cp -R dxmt research/dxmt
          cp -R madeira-dock research/madeira-dock
          
          # 4. Apply your custom graphics patch file cleanly via native Unix tool before rewriting the execution blocks
          echo "Applying late-readback patch via native Unix system patch tool..."
          patch -p1 -d research/dxmt < ./d3d9_late_readback.patch
          
          # 5. Overwrite the build script natively via clean block stream to remove the trailing patch conflict line safely
          echo "Bypassing internal submodule checkout loops..."
          cat << 'EOF' > scripts/ci-build-app.sh
          #!/bin/bash
          set -e
          mkdir -p build/xcode-derived
          echo "Building dependencies..."
          git -C FEX submodule update --init --depth 1 --jobs 3 External/fmt External/xxhash External/range-v3 External/unordered_dense
          
          # Launch Xcode toolchain natively matching compilation metrics
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration "$MADEIRA_CONFIGURATION" -derivedDataPath build/xcode-derived -sdk iphoneos ARCHS=arm64 ONLY_ACTIVE_ARCH=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          
          # Rebundle validation logic structures
          MADEIRA_APP="build/xcode-derived/Build/Products/$MADEIRA_CONFIGURATION-iphoneos/Madeira.app"
          test -s "$MADEIRA_APP/Madeira"
          for module in xtajit64.dll d3d11.dll winemetal.dll dockhost.exe; do
            test -s "$MADEIRA_APP/arm64ec-windows/$module"
          done
          test -s "$MADEIRA_APP/d3d12/libmetalirconverter.dylib"
          
          # Package final output archive container layout maps
          mkdir -p ci-output
          cp -R "$MADEIRA_APP" ci-output/Madeira.app
          echo "Build fully finished successfully."
          EOF
          chmod +x scripts/ci-build-app.sh
          
          bash scripts/ci-build-app.sh 2>&1 | tee ci-output/app-build.log

      - name: Preserve package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone
          path: |
            ci-output/
          if-no-files-found: ignore
          retention-days: 14
