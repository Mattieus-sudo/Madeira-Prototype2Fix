name: Build Madeira iPhone package
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      configuration:
        type: string
        default: Debug
      bundle_vcruntime:
        type: boolean
        default: true
      fex_run:
        type: string
        default: ''
      llvm_run:
        type: string
        default: ''
      wine_run:
        type: string
        default: ''
      i386_run:
        type: string
        default: ''
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout Root Code assets
        uses: actions/checkout@v4
        with:
          repository: 'Axoled-Student/Madeira'
          ref: 'claude/dazzling-mccarthy-7x4b15'
          submodules: recursive

      - name: Fetch local patch file
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            d3d9_late_readback.patch
          path: patch-temp

      - name: Move Patch File to Root Context
        run: |
          if [ -f "patch-temp/d3d9_late_readback.patch" ]; then
            cp patch-temp/d3d9_late_readback.patch ./d3d9_late_readback.patch
            rm -rf patch-temp
          fi

      - name: Download fex Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-fex
          run-id: ${{ inputs.fex_run }}
          github-token: ${{ github.token }}
          path: build-inputs/fex

      - name: Download llvm Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-llvm
          run-id: ${{ inputs.llvm_run }}
          github-token: ${{ github.token }}
          path: build-inputs/llvm

      - name: Download wine Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-wine
          run-id: ${{ inputs.wine_run }}
          github-token: ${{ github.token }}
          path: build-inputs/wine

      - name: Packaging Native i386 Archive Layout From Release IPA
        run: |
          mkdir -p build-inputs/i386/staging_dlls/i386-windows
          echo "Downloading production binary archive payload..."
          
          # Erase the placeholder text inside the quotes below and paste your direct IPA download link
          curl -L -o release-package.zip "https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa"
          
          # Unzip and extract the required 32-bit Windows DLL tracking folders
          unzip -q release-package.zip -d staging_extracted
          
          # Map the extracted compiled DLL files into the exact subfolder expected by the internal build system
          if [ -d "staging_extracted/Payload/Madeira.app/winedlls/x86" ]; then
            cp -R staging_extracted/Payload/Madeira.app/winedlls/x86/* build-inputs/i386/staging_dlls/i386-windows/
          elif [ -d "staging_extracted/Payload/*.app/winedlls/x86" ]; then
            cp -R staging_extracted/Payload/*.app/winedlls/x86/* build-inputs/i386/staging_dlls/i386-windows/
          else
            find staging_extracted -type d -name "x86" -exec cp -R {}/* build-inputs/i386/staging_dlls/i386-windows/ \;
          fi
          
          # Clean up download residue immediately
          rm -rf staging_extracted release-package.zip
          
          # Compress the DLL directory into the exact component archive format the master script expects
          tar -czf build-inputs/i386/i386-ios.tar.gz -C build-inputs/i386/staging_dlls .
          rm -rf build-inputs/i386/staging_dlls
          
          # Generate the precise matching checksum with the explicit relative directory path matching the master script check root
          shasum -a 256 build-inputs/i386/i386-ios.tar.gz > build-inputs/i386/i386-sha256.txt
          echo "Archive validation layout fully created: $(cat build-inputs/i386/i386-sha256.txt)"


      - name: Apply late-readback patch to dxmt
        run: |
          if [ -d "research/dxmt" ]; then
            TARGET_DIR="research/dxmt"
          elif [ -d "dxmt" ]; then
            TARGET_DIR="dxmt"
          else
            TARGET_DIR=$(find . -type d -name "dxmt" | head -n 1)
          fi
          
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: dxmt directory not found!"
            exit 1
          fi
          
          echo "Found dxmt at $TARGET_DIR. Applying late-readback patch..."
          git -C "$TARGET_DIR" apply "../../d3d9_late_readback.patch" || git -C "$TARGET_DIR" apply "../d3d9_late_readback.patch"

      - name: Build and package
        env:
          MADEIRA_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
          MADEIRA_BUNDLE_VCRUNTIME: ${{ format('{0}', inputs.bundle_vcruntime) == 'false' && '0' || '1' }}
        run: |
          mkdir -p ci-output
          set -o pipefail
          bash scripts/ci-build-app.sh 2>&1 | tee ci-output/app-build.log

      - name: Preserve package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone
          path: |
            ci-output/
            build/dxmt-ios/obj/*.err
          if-no-files-found: error
          retention-days: 14
