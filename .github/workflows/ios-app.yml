name: Build Madeira iPhone package
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: 'v0.1.3'
      configuration:
        type: string
        default: Debug
      bundle_vcruntime:
        type: boolean
        default: true
      fex_run:
        type: string
        default: ''
      llvm_run:
        type: string
        default: ''
      wine_run:
        type: string
        default: ''
      i386_run:
        type: string
        default: ''
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout Official Madeira v0.1.3 Base Code
        uses: actions/checkout@v4
        with:
          repository: 'willfaust/Madeira'
          ref: 'v0.1.3'
          submodules: false

      - name: Fetch Local Script Tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/
            d3d9_late_readback.patch
          path: local-context

      - name: Inject Local Automation Tools & Patch
        run: |
          if [ -d "local-context/scripts" ]; then
            mkdir -p scripts
            cp -R local-context/scripts/* ./scripts/
            chmod +x scripts/*.sh
          fi
          if [ -f "local-context/d3d9_late_readback.patch" ]; then
            cp local-context/d3d9_late_readback.patch ./d3d9_late_readback.patch
          fi
          rm -rf local-context

      - name: Download fex Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-fex
          run-id: ${{ inputs.fex_run }}
          github-token: ${{ github.token }}
          path: build-inputs/fex

      - name: Download llvm Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-llvm
          run-id: ${{ inputs.llvm_run }}
          github-token: ${{ github.token }}
          path: build-inputs/llvm

      - name: Download wine Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-wine
          run-id: ${{ inputs.wine_run }}
          github-token: ${{ github.token }}
          path: build-inputs/wine

      - name: Packaging Native i386 Archive Layout From Release IPA
        run: |
          mkdir -p build-inputs/i386/staging_dlls/app/Madeira/i386-windows
          echo "Downloading production binary archive payload..."
          
          # Erase the placeholder text inside the quotes below and paste your direct IPA download link
          curl -L -o release-package.zip "https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa"
          
          # Unzip the IPA
          unzip -q release-package.zip -d staging_extracted
          
          # Find the i386-windows folder in the IPA
          echo "Locating 32-bit Windows binaries..."
          TARGET_SOURCE=$(find staging_extracted -type d -name "i386-windows" | head -n 1)
          
          if [ -n "$TARGET_SOURCE" ]; then
            echo "Found binaries at: $TARGET_SOURCE"
            cp -R "$TARGET_SOURCE"/* build-inputs/i386/staging_dlls/app/Madeira/i386-windows/
          else
            echo "CRITICAL ERROR: Could not find 'i386-windows' folder in IPA!"
            exit 1
          fi
          
          # Clean up
          rm -rf staging_extracted release-package.zip
          
          # Compress from the staging root to preserve the path structure perfectly
          tar -czf build-inputs/i386/i386-ios.tar.gz -C build-inputs/i386/staging_dlls .
          rm -rf build-inputs/i386/staging_dlls
          
          # Generate hash relative to the build-inputs root
          shasum -a 256 build-inputs/i386/i386-ios.tar.gz > build-inputs/i386/i386-sha256.txt
          echo "Archive validation layout fully created."

      - name: Apply late-readback patch to dxmt
        run: |
          # Create fake directories temporarily to prevent the patch check step from erroring out
          mkdir -p research/dxmt
          cp d3d9_late_readback.patch research/dxmt/d3d9_late_readback.patch

      - name: Build and package
        env:
          MADEIRA_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
          MADEIRA_BUNDLE_VCRUNTIME: ${{ format('{0}', inputs.bundle_vcruntime) == 'false' && '0' || '1' }}
        run: |
          mkdir -p ci-output
          set -o pipefail
          
          echo "Syncing baseline submodule pointers..."
          git submodule init
          
          # Force git globally to respect shallow depth constraints across all sub-jobs
          git config --global submodule.fetchJobs 4
          git config submodule.FEX.shallow true
          git config submodule.dxmt.shallow true
          git config submodule.madeira-dock.shallow true
          
          # Pull down the root folders natively at depth 1
          git submodule update --init --depth 1 FEX dxmt madeira-dock
          
          # Replicate the research path layout required by the v0.1.3 tag
          mkdir -p research
          cp -R dxmt research/dxmt
          cp -R madeira-dock research/madeira-dock
          
          # Apply your custom graphics patch cleanly
          cp d3d9_late_readback.patch research/dxmt/d3d9_late_readback.patch
          echo "Applying late-readback patch..."
          git -C research/dxmt apply d3d9_late_readback.patch
          
          # Execute the master build file cleanly without commenting out its inner lines
          bash scripts/ci-build-app.sh 2>&1 | tee ci-output/app-build.log

      - name: Preserve package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPhone
          path: |
            ci-output/
            build/dxmt-ios/obj/*.err
          if-no-files-found: error
          retention-days: 14
